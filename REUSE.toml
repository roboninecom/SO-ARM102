# Machine-readable licence map (REUSE Specification 3.3).
# The LAST matching [[annotations]] block wins, so blocks go general -> specific.
# Human-readable version: LICENSING.md.

version = 1
SPDX-PackageName = "SO-ARM 102"
SPDX-PackageSupplier = "Robonine <https://robonine.com>"
SPDX-PackageDownloadLocation = "https://github.com/roboninecom/SO-ARM-102"

# 1. Catch-all: documentation, images, PDFs.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Copyright (c) 2026 Robonine"
SPDX-License-Identifier = "CC-BY-4.0"

# 2. Software and configuration.
[[annotations]]
path = [".github/**", ".pre-commit-config.yaml", ".gitignore", ".gitattributes"]
SPDX-FileCopyrightText = "Copyright (c) 2026 Robonine"
SPDX-License-Identifier = "Apache-2.0"

# 3. Hardware.
[[annotations]]
path = ["models/step/**", "models/stl/**", "models/3mf/**"]
SPDX-FileCopyrightText = "Copyright (c) 2026 Robonine"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

# 4. Simulation assets: explicit annotation matching the existing catch-all.
[[annotations]]
path = "simulation/**"
SPDX-FileCopyrightText = "Copyright (c) 2026 Robonine"
SPDX-License-Identifier = "CC-BY-4.0"

# ROS 2 package software and configuration.
[[annotations]]
path = [
    "simulation/ros2/so_arm_102_description/CMakeLists.txt",
    "simulation/ros2/so_arm_102_description/package.xml",
    "simulation/ros2/so_arm_102_description/launch/**",
    "simulation/ros2/so_arm_102_description/rviz/**",
]
SPDX-FileCopyrightText = "Copyright (c) 2026 Robonine"
SPDX-License-Identifier = "Apache-2.0"

# Unmodified fit gauge from Robonine Parallel Gripper, commit a6df103658fc953a7c9a7d4e769c457b3449d687.
# Source: https://raw.githubusercontent.com/roboninecom/SO-ARM100-101-Parallel-Gripper/a6df103658fc953a7c9a7d4e769c457b3449d687/models/parts/Gripper%20test%20plate%20star%20holes%206.0-6.3.STL
[[annotations]]
path = "models/stl/test/Gripper test plate star holes 6.0-6.3.STL"
SPDX-FileCopyrightText = "Copyright (c) 2025 Robonine"
SPDX-License-Identifier = "CERN-OHL-P-2.0"
